name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Pack the plugin and write SHA256SUMS
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
      # A tag push creates a draft only. Publishing stays a manual step.
      # An existing draft keeps its title, notes, and any asset that is already attached.
      - name: Create a draft release or attach assets to the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/draft-release.sh "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS
