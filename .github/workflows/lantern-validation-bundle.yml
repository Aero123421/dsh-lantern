name: lantern-validation-bundle
on:
  push:
    branches: [feat/seamless-conversation-ux]
    paths: [.github/workflows/lantern-validation-bundle.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare an isolated official DSH runtime
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/lantern-validation"
          mkdir -p "$bundle/source" "$bundle/runtime"
          git archive HEAD | tar -x -C "$bundle/source"
          cp -a node_modules "$bundle/source/node_modules"
          cp "$(command -v node)" "$bundle/node"
          npm install --prefix "$bundle/runtime" --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2 playwright@1.55.1
          "$bundle/node" --version
          ls "$bundle/runtime/node_modules/.bin"
          tar -czf "$RUNNER_TEMP/lantern-validation.tar.gz" -C "$RUNNER_TEMP" lantern-validation
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-validation-runtime
          path: ${{ runner.temp }}/lantern-validation.tar.gz
          retention-days: 1
          if-no-files-found: error
